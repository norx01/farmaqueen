<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lista de Clientes</title>

    <script src="https://cdn.tailwindcss.com"></script>

    <link rel="stylesheet" th:href="@{/css/style.css}">

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        principal: '#a11692',
                        naranja: '#fc7a1e',
                        azulClaro: '#c0d6df',
                        verde: '#517664',
                        oscuro: '#0d3b66'
                    }
                }
            }
        }
    </script>

</head>

<body class="bg-gradient-to-br from-[#c0d6df] via-[#eef4f7] to-white min-h-screen">

<div class="flex min-h-screen">

    <!-- SIDEBAR -->
    <div th:replace="fragments/layout :: sidebar('clientes')"></div>

    <!-- CONTENIDO -->
    <main class="flex-1 p-6 lg:p-10 overflow-hidden">

        <!-- HEADER -->
        <section class="page-header">

            <div>
                <small>Administración</small>

                <h1>
                    Lista de Clientes
                </h1>

                <p>
                    Gestiona, administra y controla los clientes registrados en el sistema.
                </p>
            </div>

            <div class="buttons">

                <a th:href="@{/view/clientes/form}"
                   class="btn-custom btn-principal">
                    📝 Registrar
                </a>

                <a th:href="@{/view/clientes/pdf}"
                   class="btn-custom btn-naranja">
                    📄 Exportar PDF
                </a>

                <a th:href="@{/view/clientes/excel}"
                   class="btn-custom btn-verde">
                    📊 Exportar Excel
                </a>

            </div>

        </section>

        <!-- ALERTA -->
        <div th:if="${message}"
             class="alert-success-custom"
             th:text="${message}">
        </div>

        <!-- TABLA -->
        <section class="card-table">

            <!-- HEADER TABLA -->
            <div class="card-table-header">

                <div>
                    <h2>
                        Clientes Registrados
                    </h2>

                    <p>
                        Información general del sistema.
                    </p>
                </div>

                <!-- BUSCADOR -->
                <div class="search-box">

                    <input type="text"
                           id="searchInput"
                           data-table-target="tablaClientes"
                           placeholder="Buscar cliente...">

                    <span>🔍</span>

                </div>

            </div>

            <!-- CONTENEDOR -->
            <div class="table-container">

                <table class="custom-table" id="tablaClientes">

                    <thead>
                    <tr>
                        <th>⚙️</th>
                        <th>ID</th>
                        <th>Nombre</th>
                        <th>Tipo Documento</th>
                        <th>Documento</th>
                        <th>Dirección</th>
                        <th>Teléfono</th>
                        <th>Correo</th>
                    </tr>
                    </thead>

                    <tbody>

                    <tr th:each="cliente : ${clientes}">

                        <!-- ACCIONES -->
                        <td>

                            <div class="actions">

                                <!-- EDITAR -->
                                <a th:href="@{'/view/clientes/edit/' + ${cliente.id_cliente}}"
                                   class="btn-action btn-edit">
                                    ✏️
                                </a>

                                <!-- ELIMINAR -->
                                <form th:action="@{'/view/clientes/delete/' + ${cliente.id_cliente}}"
                                      method="post">

                                    <button type="submit"
                                            class="btn-action btn-delete"
                                            onclick="return confirm('¿Está seguro que desea eliminar este cliente?')">
                                        🗑️
                                    </button>

                                </form>

                            </div>

                        </td>

                        <!-- DATOS -->
                        <td class="text-id"
                            th:text="${cliente.id_cliente}">
                        </td>

                        <td th:text="${cliente.nombre}"></td>

                        <td th:text="${cliente.tipo_documento}"></td>

                        <td th:text="${cliente.documento}"></td>

                        <td th:text="${cliente.direccion}"></td>

                        <td th:text="${cliente.telefono}"></td>

                        <td class="text-email"
                            th:text="${cliente.correo}">
                        </td>

                    </tr>

                    </tbody>

                </table>

            </div>

        </section>

    </main>

</div>

<script th:src="@{/js/script.js}"></script>

</body>
</html>
