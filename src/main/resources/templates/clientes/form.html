<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario Cliente</title>

    <script src="https://cdn.tailwindcss.com"></script>

    <link rel="stylesheet" th:href="@{/css/style.css}">

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        principal: '#a11692',
                        naranja: '#fc7a1e',
                        azulClaro: '#c0d6df',
                        verde: '#517664',
                        oscuro: '#0d3b66'
                    }
                }
            }
        }
    </script>
</head>

<body class="bg-gradient-to-br from-[#c0d6df] via-[#eef4f7] to-white min-h-screen">

<div class="flex min-h-screen">

    <!-- SIDEBAR -->
    <div th:replace="fragments/layout :: sidebar('clientes')"></div>

    <!-- CONTENIDO -->
    <main class="flex-1 p-6 lg:p-10">

        <!-- HEADER -->
        <section class="page-header">

            <div>
                <small>Administración de clientes</small>

                <h1 th:text="${clientes.id_cliente == null} ? 'Registrar Cliente' : 'Editar Cliente'">
                    Registrar Cliente
                </h1>

                <p>
                    Completa la información del cliente para registrarlo o actualizar sus datos.
                </p>
            </div>

            <div class="buttons">
                <a th:href="@{/view/clientes}" class="btn-custom btn-verde">
                    ← Volver
                </a>
            </div>

        </section>

        <!-- FORMULARIO -->
        <section class="bg-white rounded-[30px] shadow-xl overflow-hidden">

            <div class="bg-[#0d3b66] px-8 py-6">
                <h2 class="text-2xl font-bold text-white">
                    Datos del cliente
                </h2>
                <p class="text-[#c0d6df] mt-1">
                    Los campos marcados son necesarios para guardar la información.
                </p>
            </div>

            <form th:action="@{/view/clientes/save}"
                  th:object="${clientes}"
                  method="post"
                  novalidate
                  class="p-8">

                <input type="hidden" th:field="*{id_cliente}" />

                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">

                    <!-- Nombre -->
                    <div>
                        <label class="block mb-2 font-bold text-[#0d3b66]">
                            Nombre
                        </label>
                        <input type="text"
                               th:field="*{nombre}"
                               required
                               placeholder="Ingrese el nombre completo"
                               class="w-full rounded-2xl border border-gray-200 bg-gray-50 px-5 py-4 outline-none transition focus:border-[#a11692] focus:ring-4 focus:ring-[#a11692]/20">
                    </div>

                    <!-- Tipo Documento -->
                    <div>
                        <label class="block mb-2 font-bold text-[#0d3b66]">
                            Tipo de documento
                        </label>
                        <input type="text"
                               th:field="*{tipo_documento}"
                               required
                               placeholder="CC, TI, CE..."
                               class="w-full rounded-2xl border border-gray-200 bg-gray-50 px-5 py-4 outline-none transition focus:border-[#a11692] focus:ring-4 focus:ring-[#a11692]/20">
                    </div>

                    <!-- Documento -->
                    <div>
                        <label class="block mb-2 font-bold text-[#0d3b66]">
                            Documento
                        </label>
                        <input type="text"
                               th:field="*{documento}"
                               required
                               placeholder="Número de documento"
                               class="w-full rounded-2xl border border-gray-200 bg-gray-50 px-5 py-4 outline-none transition focus:border-[#a11692] focus:ring-4 focus:ring-[#a11692]/20">
                    </div>

                    <!-- Teléfono -->
                    <div>
                        <label class="block mb-2 font-bold text-[#0d3b66]">
                            Teléfono
                        </label>
                        <input type="text"
                               th:field="*{telefono}"
                               required
                               placeholder="Número de contacto"
                               class="w-full rounded-2xl border border-gray-200 bg-gray-50 px-5 py-4 outline-none transition focus:border-[#a11692] focus:ring-4 focus:ring-[#a11692]/20">
                    </div>

                    <!-- Correo -->
                    <div>
                        <label class="block mb-2 font-bold text-[#0d3b66]">
                            Correo
                        </label>
                        <input type="email"
                               th:field="*{correo}"
                               required
                               placeholder="correo@ejemplo.com"
                               class="w-full rounded-2xl border border-gray-200 bg-gray-50 px-5 py-4 outline-none transition focus:border-[#a11692] focus:ring-4 focus:ring-[#a11692]/20">
                    </div>

                    <!-- Dirección -->
                    <div>
                        <label class="block mb-2 font-bold text-[#0d3b66]">
                            Dirección
                        </label>
                        <input type="text"
                               th:field="*{direccion}"
                               required
                               placeholder="Dirección de residencia"
                               class="w-full rounded-2xl border border-gray-200 bg-gray-50 px-5 py-4 outline-none transition focus:border-[#a11692] focus:ring-4 focus:ring-[#a11692]/20">
                    </div>

                </div>

                <!-- BOTONES -->
                <div class="flex flex-col sm:flex-row justify-end gap-4 mt-8 pt-6 border-t border-gray-100">

                    <a th:href="@{/view/clientes}"
                       class="btn-custom btn-verde justify-center">
                        ← Volver
                    </a>

                    <button type="submit"
                            class="btn-custom btn-principal justify-center">
                        💾 Guardar Cliente
                    </button>

                </div>

            </form>

        </section>

    </main>

</div>

<script th:src="@{/js/script.js}"></script>
</body>
</html>
