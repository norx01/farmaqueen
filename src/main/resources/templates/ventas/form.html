<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nueva Venta</title>

    <script src="https://cdn.tailwindcss.com"></script>

    <link rel="stylesheet" th:href="@{/css/style.css}">

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        principal: '#a11692',
                        naranja: '#fc7a1e',
                        azulClaro: '#c0d6df',
                        verde: '#517664',
                        oscuro: '#0d3b66'
                    }
                }
            }
        }
    </script>
</head>

<body class="bg-gradient-to-br from-[#c0d6df] via-[#eef4f7] to-white min-h-screen">

<div class="flex min-h-screen">

    <!-- SIDEBAR -->
    <div th:replace="fragments/layout :: sidebar('ventas')"></div>

    <!-- CONTENIDO -->
    <main class="flex-1 p-6 lg:p-10">

        <!-- HEADER -->
        <section class="page-header">

            <div>
                <small>Facturación</small>

                <h1>
                    Nueva Venta
                </h1>

                <p>
                    Selecciona el cliente, agrega productos y confirma el medio de pago.
                </p>
            </div>

            <div class="buttons">
                <a th:href="@{/view/ventas}" class="btn-custom btn-verde">
                    ← Volver
                </a>
            </div>

        </section>

        <!-- ALERTA -->
        <div th:if="${error}"
             class="alert-error-custom"
             th:text="${error}">
        </div>

        <form th:action="@{/view/ventas/save}"
              method="post"
              id="ventaForm"
              class="grid grid-cols-1 xl:grid-cols-[1fr_360px] gap-6 items-start">

            <!-- DETALLE -->
            <section class="bg-white rounded-[30px] shadow-xl overflow-hidden">

                <div class="bg-[#0d3b66] px-8 py-6">
                    <h2 class="text-2xl font-bold text-white">
                        Datos de la venta
                    </h2>
                    <p class="text-[#c0d6df] mt-1">
                        La fecha y hora se registran automáticamente al efectuar la venta.
                    </p>
                </div>

                <div class="p-8 space-y-8">

                    <div class="grid grid-cols-1 md:grid-cols-2 gap-6">

                        <!-- Cliente -->
                        <div>
                            <label class="block mb-2 font-bold text-[#0d3b66]">
                                Cliente
                            </label>
                            <select name="clienteId"
                                    required
                                    class="w-full rounded-2xl border border-gray-200 bg-gray-50 px-5 py-4 outline-none transition focus:border-[#a11692] focus:ring-4 focus:ring-[#a11692]/20">
                                <option value="">Seleccione un cliente</option>
                                <option th:each="cliente : ${clientes}"
                                        th:value="${cliente.id_cliente}"
                                        th:text="${cliente.nombre + ' - ' + cliente.documento}">
                                </option>
                            </select>
                        </div>

                        <!-- Fecha y hora -->
                        <div>
                            <label class="block mb-2 font-bold text-[#0d3b66]">
                                Fecha y hora
                            </label>
                            <input type="text"
                                   id="fechaHoraVenta"
                                   readonly
                                   class="w-full rounded-2xl border border-gray-200 bg-gray-50 px-5 py-4 outline-none text-gray-500">
                        </div>

                    </div>

                    <!-- Agregar producto -->
                    <div class="grid grid-cols-1 lg:grid-cols-[1fr_160px_auto] gap-4 items-end">

                        <div>
                            <label class="block mb-2 font-bold text-[#0d3b66]">
                                Producto
                            </label>
                            <select id="productoSelect"
                                    class="w-full rounded-2xl border border-gray-200 bg-gray-50 px-5 py-4 outline-none transition focus:border-[#a11692] focus:ring-4 focus:ring-[#a11692]/20">
                                <option value="">Seleccione un producto</option>
                                <option th:each="producto : ${productos}"
                                        th:value="${producto.id_producto}"
                                        th:data-nombre="${producto.nombre}"
                                        th:data-precio="${producto.precio}"
                                        th:data-stock="${producto.stock}"
                                        th:text="${producto.nombre + ' - Stock: ' + producto.stock + ' - $' + producto.precio}">
                                </option>
                            </select>
                        </div>

                        <div>
                            <label class="block mb-2 font-bold text-[#0d3b66]">
                                Cantidad
                            </label>
                            <input type="number"
                                   id="cantidadProducto"
                                   min="1"
                                   step="1"
                                   value="1"
                                   class="w-full rounded-2xl border border-gray-200 bg-gray-50 px-5 py-4 outline-none transition focus:border-[#a11692] focus:ring-4 focus:ring-[#a11692]/20">
                        </div>

                        <button type="button"
                                id="agregarProductoVenta"
                                class="btn-custom btn-principal justify-center">
                            + Agregar
                        </button>

                    </div>

                    <!-- Tabla productos -->
                    <div class="table-container border border-gray-100 rounded-2xl">

                        <table class="custom-table" id="tablaDetalleVenta">

                            <thead>
                            <tr>
                                <th>Producto</th>
                                <th>Precio</th>
                                <th>Cantidad</th>
                                <th>Subtotal</th>
                                <th>Acción</th>
                            </tr>
                            </thead>

                            <tbody>
                            </tbody>

                        </table>

                    </div>

                </div>

            </section>

            <!-- RESUMEN -->
            <aside class="bg-white rounded-[30px] shadow-xl overflow-hidden xl:sticky xl:top-8">

                <div class="bg-[#0d3b66] px-8 py-6">
                    <h2 class="text-2xl font-bold text-white">
                        Resumen
                    </h2>
                    <p class="text-[#c0d6df] mt-1">
                        Total de la venta.
                    </p>
                </div>

                <div class="p-8 space-y-6">

                    <div class="rounded-2xl bg-gray-50 border border-gray-100 p-5">
                        <p class="text-sm font-bold text-[#0d3b66] uppercase">
                            Total venta
                        </p>
                        <p class="text-4xl font-black text-[#a11692] mt-2" id="totalVentaTexto">
                            $0.00
                        </p>
                    </div>

                    <div>
                        <label class="block mb-2 font-bold text-[#0d3b66]">
                            Medio de pago
                        </label>
                        <select name="medio_pago"
                                required
                                class="w-full rounded-2xl border border-gray-200 bg-gray-50 px-5 py-4 outline-none transition focus:border-[#a11692] focus:ring-4 focus:ring-[#a11692]/20">
                            <option value="">Seleccione el medio de pago</option>
                            <option value="Efectivo">Efectivo</option>
                            <option value="Tarjeta">Tarjeta</option>
                            <option value="Transferencia">Transferencia</option>
                            <option value="Nequi">Nequi</option>
                            <option value="Daviplata">Daviplata</option>
                        </select>
                    </div>

                    <button type="submit"
                            class="btn-custom btn-principal justify-center w-full">
                        💾 Efectuar Venta
                    </button>

                </div>

            </aside>

        </form>

    </main>

</div>

<script th:src="@{/js/script.js}"></script>
</body>
</html>
