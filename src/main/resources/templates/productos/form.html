<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario Producto</title>

    <script src="https://cdn.tailwindcss.com"></script>

    <link rel="stylesheet" th:href="@{/css/style.css}">

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        principal: '#a11692',
                        naranja: '#fc7a1e',
                        azulClaro: '#c0d6df',
                        verde: '#517664',
                        oscuro: '#0d3b66'
                    }
                }
            }
        }
    </script>
</head>

<body class="bg-gradient-to-br from-[#c0d6df] via-[#eef4f7] to-white min-h-screen">

<div class="flex min-h-screen">

    <!-- SIDEBAR -->
    <div th:replace="fragments/layout :: sidebar('productos')"></div>

    <!-- CONTENIDO -->
    <main class="flex-1 p-6 lg:p-10">

        <!-- HEADER -->
        <section class="page-header">

            <div>
                <small>Inventario de productos</small>

                <h1 th:text="${productos.id_producto == null} ? 'Registrar Producto' : 'Editar Producto'">
                    Registrar Producto
                </h1>

                <p>
                    Completa la información del producto para registrarlo o actualizar sus datos.
                </p>
            </div>

            <div class="buttons">
                <a th:href="@{/view/productos}" class="btn-custom btn-verde">
                    ← Volver
                </a>
            </div>

        </section>

        <!-- FORMULARIO -->
        <section class="bg-white rounded-[30px] shadow-xl overflow-hidden">

            <div class="bg-[#0d3b66] px-8 py-6">
                <h2 class="text-2xl font-bold text-white">
                    Datos del producto
                </h2>
                <p class="text-[#c0d6df] mt-1">
                    Los campos marcados son necesarios para guardar la información.
                </p>
            </div>

            <form th:action="@{/view/productos/save}"
                  th:object="${productos}"
                  method="post"
                  novalidate
                  class="p-8">

                <input type="hidden" th:field="*{id_producto}" />

                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">

                    <!-- Nombre -->
                    <div>
                        <label class="block mb-2 font-bold text-[#0d3b66]">
                            Nombre
                        </label>
                        <input type="text"
                               th:field="*{nombre}"
                               required
                               placeholder="Ingrese el nombre del producto"
                               class="w-full rounded-2xl border border-gray-200 bg-gray-50 px-5 py-4 outline-none transition focus:border-[#a11692] focus:ring-4 focus:ring-[#a11692]/20">
                    </div>

                    <!-- Código -->
                    <div>
                        <label class="block mb-2 font-bold text-[#0d3b66]">
                            Código
                        </label>
                        <input type="text"
                               th:field="*{codigo}"
                               required
                               placeholder="Código del producto"
                               class="w-full rounded-2xl border border-gray-200 bg-gray-50 px-5 py-4 outline-none transition focus:border-[#a11692] focus:ring-4 focus:ring-[#a11692]/20">
                    </div>

                    <!-- Precio -->
                    <div>
                        <label class="block mb-2 font-bold text-[#0d3b66]">
                            Precio
                        </label>
                        <input type="number"
                               th:field="*{precio}"
                               required
                               min="0"
                               step="0.01"
                               placeholder="Precio del producto"
                               class="w-full rounded-2xl border border-gray-200 bg-gray-50 px-5 py-4 outline-none transition focus:border-[#a11692] focus:ring-4 focus:ring-[#a11692]/20">
                    </div>

                    <!-- Lote -->
                    <div>
                        <label class="block mb-2 font-bold text-[#0d3b66]">
                            Lote
                        </label>
                        <input type="text"
                               th:field="*{lote}"
                               required
                               placeholder="Lote del producto"
                               class="w-full rounded-2xl border border-gray-200 bg-gray-50 px-5 py-4 outline-none transition focus:border-[#a11692] focus:ring-4 focus:ring-[#a11692]/20">
                    </div>

                    <!-- Fecha Fabricación -->
                    <div>
                        <label class="block mb-2 font-bold text-[#0d3b66]">
                            Fecha fabricación
                        </label>
                        <input type="date"
                               th:field="*{fecha_fabricacion}"
                               required
                               class="w-full rounded-2xl border border-gray-200 bg-gray-50 px-5 py-4 outline-none transition focus:border-[#a11692] focus:ring-4 focus:ring-[#a11692]/20">
                    </div>

                    <!-- Fecha Vencimiento -->
                    <div>
                        <label class="block mb-2 font-bold text-[#0d3b66]">
                            Fecha vencimiento
                        </label>
                        <input type="date"
                               th:field="*{fecha_vencimiento}"
                               required
                               class="w-full rounded-2xl border border-gray-200 bg-gray-50 px-5 py-4 outline-none transition focus:border-[#a11692] focus:ring-4 focus:ring-[#a11692]/20">
                    </div>

                    <!-- Stock -->
                    <div>
                        <label class="block mb-2 font-bold text-[#0d3b66]">
                            Stock
                        </label>
                        <input type="number"
                               th:field="*{stock}"
                               required
                               min="0"
                               step="1"
                               placeholder="Cantidad disponible"
                               class="w-full rounded-2xl border border-gray-200 bg-gray-50 px-5 py-4 outline-none transition focus:border-[#a11692] focus:ring-4 focus:ring-[#a11692]/20">
                    </div>

                    <!-- Stock Mínimo -->
                    <div>
                        <label class="block mb-2 font-bold text-[#0d3b66]">
                            Stock mínimo
                        </label>
                        <input type="number"
                               th:field="*{stock_minimo}"
                               required
                               min="0"
                               step="1"
                               placeholder="Cantidad mínima"
                               class="w-full rounded-2xl border border-gray-200 bg-gray-50 px-5 py-4 outline-none transition focus:border-[#a11692] focus:ring-4 focus:ring-[#a11692]/20">
                    </div>

                </div>

                <!-- BOTONES -->
                <div class="flex flex-col sm:flex-row justify-end gap-4 mt-8 pt-6 border-t border-gray-100">

                    <a th:href="@{/view/productos}"
                       class="btn-custom btn-verde justify-center">
                        ← Volver
                    </a>

                    <button type="submit"
                            class="btn-custom btn-principal justify-center">
                        💾 Guardar Producto
                    </button>

                </div>

            </form>

        </section>

    </main>

</div>

<script th:src="@{/js/script.js}"></script>
</body>
</html>
